[package]
name = "zecathon-carrier-verifier"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
orchard = { version = "0.16", default-features = false }
zcash_keys = { version = "=0.17.0-pre.2", default-features = false, features = ["orchard"] }
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false }
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }

# Signing is a separate build feature. The independent verifier has no seed reader.
age = { version = "0.12", features = ["armor"], optional = true }
bip0039 = { version = "0.14", features = ["std"], optional = true }
zeroize = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
rand = { version = "0.10", optional = true }
zip32 = { version = "0.3", optional = true }
pasta_curves = { version = "0.6", optional = true }
incrementalmerkletree = { version = "0.9", features = ["legacy-api"], optional = true }
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"], optional = true }
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.2", optional = true }
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818", features = ["zcp-builder", "io-finalizer", "prover", "signer", "tx-extractor"], optional = true }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818", default-features = false, features = ["orchard", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
mainnet = ["dep:tokio", "dep:zcash_client_backend"]
trustee = ["sender", "dep:pczt"]
sender = ["dep:age", "dep:bip0039", "dep:zeroize", "dep:toml", "dep:rand", "dep:zip32", "dep:pasta_curves", "dep:incrementalmerkletree", "dep:zcash_proofs", "dep:transparent", "dep:pczt", "zcash_keys/std", "zcash_primitives/circuits", "zcash_primitives/std", "zcash_primitives/multicore"]

[patch.crates-io]
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }

zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818" }
